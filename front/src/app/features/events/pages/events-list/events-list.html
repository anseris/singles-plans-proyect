<app-events-page
  [activeSection]="vm.activeSection()"
  [myGroups]="vm.myGroups()"
  [allGroups]="vm.allGroups()"
  [interestGroups]="vm.interestGroups()"
  [canCreateAnyEvent]="vm.isAdmin"
  [authenticated]="!!vm.user()"
  [events]="vm.visibleEvents()"
  [filteredEvents]="vm.filteredEvents()"
  [loading]="vm.loading()"
  [error]="vm.error()"
  [notice]="vm.notice()"
  [groupJoinNotice]="vm.groupJoinNotice()"
  [searchTerm]="vm.searchTerm()"
  [adminView]="vm.adminView()"
  [isSuperusuario]="vm.isSuperusuario"
  [myEvents]="vm.myEvents()"
  [joinedEventsCount]="vm.joinedGroupEvents().length"
  [myPublishedCount]="vm.myPublishedEvents().length"
  [myPendingCount]="vm.myPendingEvents().length"
  [myJoinedEventsCount]="vm.myEnrolledEvents().length"
  [unenrollingEventId]="vm.unenrollingEventId()"
  [eventListView]="vm.eventListView()"
  (createGroupRequested)="openCreateGroup()"
  (loginRequested)="vm.openAuth('register')"
  (groupSelected)="vm.openGroupDetails($event)"
  (eventRequested)="openCreateEvent($event._id)"
  (joinRequested)="vm.joinGroup($event)"
  (enrollRequested)="vm.enroll($event)"
  (statusChanged)="vm.setStatus($event.event, $event.status)"
  (editRequested)="vm.openEditEvent($event)"
  (deleteRequested)="vm.deleteEvent($event)"
  (searchChanged)="vm.updateSearch($event)"
  (searchCleared)="vm.clearFilters()"
  (plansRequested)="vm.scrollToPlans()"
  (eventListViewSelected)="vm.setEventListView($event)"
  (unenrollRequested)="vm.unenroll($event)"
/>
