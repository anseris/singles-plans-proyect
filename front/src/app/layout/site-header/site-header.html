<header class="site-header">
  <a class="brand" routerLink="/eventos">
    <span class="brand-mark"><i class="pi pi-compass"></i></span>
    <span>Singles<span class="brand-highlight">Plans</span></span>
  </a>
  <nav class="main-nav" aria-label="Navegación principal">
    <a routerLink="/eventos" [class.active]="activeSection() === 'events' && !adminView()"
      >Eventos</a
    >
    <a routerLink="/viajes" [class.active]="activeSection() === 'trips' && !adminView()">Viajes</a>
  </nav>
  <div class="header-actions">
    @if (user(); as currentUser) {
      @if (currentUser.role === 'admin') {
        <button class="admin-link" type="button" (click)="adminViewToggled.emit()">
          <i class="pi" [class.pi-shield]="!adminView()" [class.pi-compass]="adminView()"></i>
          {{ adminView() ? 'Vista pública' : 'Administración' }}
        </button>
      }

      <div class="user-menu">
        <button
          class="user-menu-trigger"
          type="button"
          aria-haspopup="menu"
          [attr.aria-expanded]="menuOpen()"
          (click)="toggleMenu()"
        >
          <app-user-avatar
            [name]="currentUser.name"
            [avatarUrl]="currentUser.avatarUrl ?? ''"
            size="small"
          />
          <span class="user-menu-name">{{ currentUser.name.split(' ')[0] }}</span>
          <i class="pi pi-chevron-down user-menu-chevron" [class.is-open]="menuOpen()"></i>
        </button>

        @if (menuOpen()) {
          <div class="user-menu-panel" role="menu">
            <div class="user-menu-header">
              <strong>{{ currentUser.name }}</strong>
              <small>{{ currentUser.email }}</small>
            </div>
            <a
              class="user-menu-item"
              role="menuitem"
              routerLink="/cuenta/perfil"
              (click)="closeMenu()"
            >
              <i class="pi pi-user"></i>
              Ver perfil
            </a>
            <a
              class="user-menu-item"
              role="menuitem"
              routerLink="/cuenta/configuracion"
              (click)="closeMenu()"
            >
              <i class="pi pi-cog"></i>
              Configuración
            </a>
            <button
              class="user-menu-item user-menu-logout"
              type="button"
              role="menuitem"
              (click)="closeMenu(); logoutRequested.emit()"
            >
              <i class="pi pi-sign-out"></i>
              Salir
            </button>
          </div>
        }
      </div>
    } @else {
      <button class="text-button desktop-only" type="button" (click)="loginRequested.emit()">
        Iniciar sesión
      </button>
      <p-button label="Crear cuenta" (onClick)="registerRequested.emit()" />
    }
  </div>
</header>
