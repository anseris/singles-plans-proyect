<article
  class="plan-card event-card"
  [class.admin-card]="adminView()"
>
  <button
    class="event-card-open"
    type="button"
    [attr.aria-label]="'Ver detalles de ' + event().title"
    (click)="openDetails()"
  >
    <div class="card-art">
      @if (event().imageUrl) {
        <img class="card-photo" [src]="event().imageUrl" [alt]="event().title" />
      } @else {
        <div class="event-image-placeholder" aria-hidden="true">
          {{ eventInitial(event().title) }}
        </div>
      }
    </div>
    <div class="card-content">
      <h3>{{ event().title }}</h3>
      <p class="event-card-group">
        <i class="pi pi-users"></i>{{ event().group?.name || 'Grupo sin nombre' }}
      </p>
      <div class="event-card-footer">
        <span><i class="pi pi-calendar"></i>{{ eventDateTimeLabel(event()) }}</span>
        <span><i class="pi pi-user"></i>{{ event().enrolledCount ?? 0 }} asistentes</span>
      </div>
      @if ((isOwner() || adminView()) && event().status === 'pending') {
        <span class="event-card-status">Pendiente de aprobación</span>
      }
    </div>
  </button>
  @if (event().isEnrolled) {
    <div class="event-card-attendance">
      <span><i class="pi pi-check-circle"></i> Asistirás</span>
      <button
        type="button"
        [disabled]="unenrollDisabled()"
        [attr.aria-label]="'Desapuntarme de ' + event().title"
        (click)="unenrollRequested.emit(event())"
      >
        @if (unenrolling()) {
          <i class="pi pi-spin pi-spinner"></i>
        }
        Desapuntarme
      </button>
    </div>
  }
</article>
