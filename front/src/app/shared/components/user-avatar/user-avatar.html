<span
  class="user-avatar"
  [class.user-avatar-small]="size() === 'small'"
  [class.user-avatar-medium]="size() === 'medium'"
  [class.user-avatar-large]="size() === 'large'"
  [class.user-avatar-zoomable]="canZoom()"
  [attr.role]="canZoom() ? 'button' : 'img'"
  [attr.aria-label]="canZoom() ? 'Ampliar imagen de ' + name() : 'Avatar de ' + name()"
  [attr.tabindex]="canZoom() ? 0 : null"
  (click)="onImageClick($event)"
  (keydown.enter)="onImageClick($event)"
  (keydown.space)="onImageClick($event)"
>
  @if (showImage()) {
    <img [src]="resolvedUrl()" [alt]="'Avatar de ' + name()" (error)="onImageError()" />
  } @else {
    <span class="user-avatar-initial" aria-hidden="true">{{ initial() }}</span>
  }
</span>
