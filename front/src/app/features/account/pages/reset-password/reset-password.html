<section class="reset-page">
  <div class="reset-card">
    <a routerLink="/eventos" class="reset-back"><i class="pi pi-arrow-left" aria-hidden="true"></i> Volver a SinglesPlans</a>
    <h1>Restablece tu contraseña</h1>
    <p class="reset-intro">Elige una contraseña nueva para acceder a tu cuenta.</p>

    @if (error()) {
      <div class="alert error" role="alert">{{ error() }}</div>
    }
    @if (notice()) {
      <div class="alert success" role="status">{{ notice() }}</div>
    }

    <form class="auth-form" (ngSubmit)="submit()" novalidate>
      <label class="auth-field" for="reset-password">
        <span>Nueva contraseña</span>
        <p-password
          inputId="reset-password"
          name="newPassword"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          [toggleMask]="true"
          [feedback]="false"
          autocomplete="new-password"
          placeholder="Mínimo 8 caracteres"
        />
      </label>

      <label class="auth-field" for="reset-confirm-password">
        <span>Repita contraseña</span>
        <p-password
          inputId="reset-confirm-password"
          name="confirmPassword"
          [ngModel]="confirmPassword()"
          (ngModelChange)="confirmPassword.set($event)"
          [toggleMask]="true"
          [feedback]="false"
          autocomplete="new-password"
          placeholder="Repite la contraseña"
        />
      </label>

      <app-turnstile-widget (tokenChanged)="setCaptchaToken($event)" />

      <p-button
        type="submit"
        label="Guardar contraseña"
        icon="pi pi-check"
        styleClass="auth-submit"
        [loading]="submitting()"
        [disabled]="!formValid() || submitting()"
      />
    </form>
  </div>
</section>
