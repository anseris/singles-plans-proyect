<app-site-header
  [user]="vm.user()"
  [activeSection]="vm.activeSection()"
  [adminView]="vm.adminView()"
  (sectionSelected)="vm.switchSection($event)"
  (adminViewToggled)="vm.switchView(!vm.adminView())"
  (loginRequested)="vm.openAuth('login')"
  (registerRequested)="vm.openAuth('register')"
  (logoutRequested)="vm.logout()"
/>

<main>
  <router-outlet />
</main>

<app-site-footer />

<p-dialog [visible]="vm.dialogOpen()" (visibleChange)="vm.dialogOpen.set($event)" [header]="vm.authMode() === 'login' ? 'Qué bueno verte' : 'Únete a SinglesPlans'" [modal]="true" [draggable]="false" [resizable]="false" styleClass="auth-dialog">
  <p class="dialog-subtitle">{{ vm.authMode() === 'login' ? 'Inicia sesión y encuentra tu próximo plan.' : 'Crea tu cuenta y empieza a descubrir.' }}</p>
  @if (vm.error()) { <div class="alert error dialog-alert">{{ vm.error() }}</div> }
  <form class="auth-form" (ngSubmit)="vm.submitAuth()">
    @if (vm.authMode() === 'register') {
      <label>Nombre<input pInputText name="name" [(ngModel)]="vm.credentials.name" autocomplete="name" required /></label>
    }
    <label>Email<input pInputText name="email" type="email" [(ngModel)]="vm.credentials.email" autocomplete="email" required /></label>
    <label>Contraseña<input pInputText name="password" type="password" [(ngModel)]="vm.credentials.password" [attr.minlength]="vm.authMode() === 'register' ? 8 : null" autocomplete="current-password" required /></label>
    <p-button [label]="vm.authMode() === 'login' ? 'Iniciar sesión' : 'Crear mi cuenta'" icon="pi pi-arrow-right" type="submit" styleClass="w-full" />
  </form>
  <p class="auth-switch">
    {{ vm.authMode() === 'login' ? '¿Aún no tienes cuenta?' : '¿Ya tienes una cuenta?' }}
    <button type="button" (click)="vm.openAuth(vm.authMode() === 'login' ? 'register' : 'login')">{{ vm.authMode() === 'login' ? 'Regístrate' : 'Inicia sesión' }}</button>
  </p>
</p-dialog>
